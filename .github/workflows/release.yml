name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NODE_VERSION: "26"
  PNPM_VERSION: "12.18"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: pnpm/setup@v3.2.0
        with:
          runtime: node@${{ env.NODE_VERSION }}
          version: ${{ env.PNPM_VERSION }}

      - name: Build
        run: pnpm build

      - name: Pack themes
        run: |
          zip -r myrt-code-vscode.zip dist/vscode
          zip -r myrt-code-ghostty.zip dist/ghostty
          zip -r myrt-code-zed.zip dist/zed

      - name: Extract release notes from CHANGELOG.md
        run: |
          node scripts/get_notes.js ${{ github.ref_name }} > RELEASE_NOTES.md

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3.0.4
        with:
          body_path: RELEASE_NOTES.md
          files: |
            myrt-code-vscode.zip
            myrt-code-ghostty.zip
            myrt-code-zed.zip
